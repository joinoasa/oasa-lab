name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The L2 hardware suites run on the simulated bench here; real hardware runs happen on the lab PC.
      OASA_LAB_SIM: "1"
    strategy:
      fail-fast: false
      matrix:
        suite: [l0-lab, l1-channel, l1-plaintext-control, l1-profiles, l2-pluto-acceptance, l2-rf-control]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .
      - name: Install pyserial (l0-lab tests the real serial driver against a pseudo-terminal)
        if: matrix.suite == 'l0-lab'
        run: python -m pip install pyserial
      - name: Run the suite (tests, evidence bundle, checker)
        id: run
        run: |
          set -euo pipefail
          oasa-lab run "${{ matrix.suite }}" --out runs | tee "$RUNNER_TEMP/run.txt"
          BUNDLE="$(sed -n 's/^bundle: *//p' "$RUNNER_TEMP/run.txt")"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$BUNDLE")" >> "$GITHUB_OUTPUT"
      - name: Show the summary
        if: always()
        run: cat runs/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Pack the bundle
        run: |
          set -euo pipefail
          tar -C runs -czf "${{ matrix.suite }}-bundle.tar.gz" "${{ steps.run.outputs.name }}"
          cp "runs/${{ steps.run.outputs.name }}.check.json" "${{ matrix.suite }}-check.json"
      - name: A tampered copy must fail the checker
        run: |
          set -euo pipefail
          rm -rf tamper && mkdir tamper
          tar -C tamper -xzf "${{ matrix.suite }}-bundle.tar.gz"
          B="tamper/${{ steps.run.outputs.name }}"
          printf 'x' >> "$B/manifest.json"
          if oasa-lab check "$B"; then echo "checker passed a tampered bundle"; exit 1; fi
          echo "tampered bundle was rejected, as it should be"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.suite }}-evidence
          path: |
            ${{ matrix.suite }}-bundle.tar.gz
            ${{ matrix.suite }}-check.json
          if-no-files-found: error
      - name: Attest the bundle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.suite }}-bundle.tar.gz

  # The remote job service and Claude connector (oasa_lab/service): real jobs, a live localhost server,
  # an MCP client, a faked GitHub. No hardware, no secrets, no network beyond localhost.
  service:
    name: job service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[service]'
      - name: Test
        run: python -m pytest -o addopts="" tests/service -q

  # The real encrypted link from oasa-sec, through the simulated channel.
  # Lab changes are tested against oasa-sec main; oasa-sec runs this suite on its own pull requests.
  link:
    name: l1-oasa-link (oasa-sec main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: joinoasa/oasa-sec
          ref: main
          path: oasa-sec
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build oasa-sec
        working-directory: oasa-sec
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          cargo build --locked --bins
      - name: Install
        run: python -m pip install -e .
      - name: Run the suite (tests, evidence bundle, checker)
        run: |
          set -euo pipefail
          OASA_SEC_BIN_DIR="$GITHUB_WORKSPACE/oasa-sec/target/debug" oasa-lab run l1-oasa-link --out runs | tee "$RUNNER_TEMP/run.txt"
      - name: Show the summary
        if: always()
        run: cat runs/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: l1-oasa-link-evidence
          path: runs/
          if-no-files-found: error

  # The encrypted link over simulated LoRa modems: oasa-link and oasa-radio bridges, both from main,
  # on the simulated bench. The real-hardware run of this suite happens on the lab PC.
  lora-link:
    name: l2-lora-link, simulated bench (oasa-sec and oasa-radio main)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: joinoasa/oasa-sec
          ref: main
          path: oasa-sec
      - uses: actions/checkout@v7
        with:
          repository: joinoasa/oasa-radio
          ref: main
          path: oasa-radio
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build oasa-sec and oasa-radio
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          (cd oasa-sec && cargo build --locked --bins)
          (cd oasa-radio && cargo build --locked --bins)
      - name: Install
        run: python -m pip install -e .
      - name: Run the suite (tests, evidence bundle, checker)
        run: |
          set -euo pipefail
          OASA_LAB_SIM=1 \
          OASA_SEC_BIN_DIR="$GITHUB_WORKSPACE/oasa-sec/target/debug" \
          OASA_RADIO_BIN_DIR="$GITHUB_WORKSPACE/oasa-radio/target/debug" \
            oasa-lab run l2-lora-link --out runs | tee "$RUNNER_TEMP/run.txt"
      - name: Show the summary
        if: always()
        run: cat runs/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: l2-lora-link-evidence
          path: runs/
          if-no-files-found: error

  # OASA's own waveform (R-COM2 milestone W0): the modem from oasa-radio main, driven through its command line.
  # Lab changes are tested against oasa-radio main, so oasa-radio's waveform pull request merges first.
  waveform-w0:
    name: l1-waveform-w0 (oasa-radio main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: joinoasa/oasa-radio
          ref: main
          path: oasa-radio
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build oasa-radio
        working-directory: oasa-radio
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          cargo build --locked --bins
      - name: Install
        run: python -m pip install -e .
      - name: Run the suite (tests, evidence bundle, checker)
        run: |
          set -euo pipefail
          OASA_RADIO_BIN_DIR="$GITHUB_WORKSPACE/oasa-radio/target/debug" \
            oasa-lab run l1-waveform-w0 --out runs | tee "$RUNNER_TEMP/run.txt"
      - name: Show the summary
        if: always()
        run: cat runs/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: l1-waveform-w0-evidence
          path: runs/
          if-no-files-found: error
