# lab.toml: which device is which, and how the cables run. Copy to lab.toml and edit.
# lab.toml is not committed. `oasa-lab devices` opens every device below and shows what it reports.
# Docs: docs/hardware-suites.md. Run on the simulated bench with OASA_LAB_SIM=1 (no file needed).

[lab]
name = "bench-1"
backend = "hardware"          # "hardware", or "sim" to run everything simulated

# USB hub with per-port power switching. Used to power-cycle a radio from a script.
# kind = "ykush3" runs `ykushcmd` (Apache-2.0). kind = "uhubctl" runs `uhubctl` (GPL-2.0, a separate process).
[hub]
kind = "ykush3"
serial = "YK3R0000"           # `ykushcmd -l` shows it
# location = "1-1"            # uhubctl: the hub's location from `uhubctl`

# --- Pluto+ (AD9363, 2 TX / 2 RX) over Ethernet or USB ---------------------------------------------
[devices.pluto0]
kind = "pluto"
uri = "ip:192.168.2.1"        # or "usb:1.2.5". Only ever reach it on the lab network or over WireGuard.
serial = "104400000000"       # `iio_info -u URI | grep hw_serial`. The suite refuses a different unit.
hub_port = 1
channels = 2
# After a first good run, copy the measured levels here (see docs/hardware-suites.md, "Calibration"):
# [devices.pluto0.calibration.rx_dbfs]
# "433-rx1" = -23.0
# "433-rx2" = -19.5

# --- RTL-SDR Blog V4 (receive only) -----------------------------------------------------------------
[devices.rtl0]
kind = "rtlsdr"
serial = "00000001"           # `rtl_test` lists it as SN. Set a unique one with rtl_eeprom if you have two.
hub_port = 2
# Optional: this dongle's own frequency error in ppm, measured against a better reference (a GPSDO, or a
# known stable carrier). With it the Pluto's crystal is judged against its 0.5 ppm spec directly.
# known_ppm = -0.4

# --- Two Heltec WiFi LoRa 32 V3 running the OASA LoRa modem firmware --------------------------------
[devices.heltec_a]
kind = "serial-radio"
model = "Heltec WiFi LoRa 32 V3"
port = "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_AA:AA:AA:AA:AA:AA-if00"
usb_serial = "AA:AA:AA:AA:AA:AA"   # the board's USB serial; the suite refuses a port that belongs to another board
serial = "AA:AA:AA:AA:AA:AA"
firmware = "oasa-lora-modem 0.1.0"  # what you flashed (the modem has no way to tell us yet)
firmware_sha256 = ""                # sha256 of the flashed image
hub_port = 3
# dtr = true                        # serial control lines at open; some boards reset on RTS
# rts = false
[devices.heltec_a.radio]            # must equal what the firmware was built with
profile = "lora-sf7-bw125"          # airtime model: see `oasa-lab profiles`
freq_mhz = 915.0
tx_power_dbm = 10

[devices.heltec_b]
kind = "serial-radio"
model = "Heltec WiFi LoRa 32 V3"
port = "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_BB:BB:BB:BB:BB:BB-if00"
usb_serial = "BB:BB:BB:BB:BB:BB"
serial = "BB:BB:BB:BB:BB:BB"
firmware = "oasa-lora-modem 0.1.0"
firmware_sha256 = ""
hub_port = 4
[devices.heltec_b.radio]
profile = "lora-sf7-bw125"
freq_mhz = 915.0
tx_power_dbm = 10

# --- KORAD KA3005P bench supply ---------------------------------------------------------------------
# Never more than 6 V, 3 A: that limit is in the driver. max_v and max_a here can only lower it.
# The output is off at open and close. If this supply feeds a radio, set hold_output = true: the driver then
# leaves the output alone. Without it, `oasa-lab devices` turns the output off.
[devices.korad0]
kind = "korad"
port = "/dev/serial/by-id/usb-Nuvoton_USB_Virtual_COM_000000000000-if00"
serial = "00000000"           # `*IDN?` shows it. The driver refuses a different unit, before it changes anything.
# max_v = 5.5
# max_a = 2.0
# hold_output = true

# --- RF power sensor (reads only) ---------------------------------------------------------------------
# SCPI over usbtmc, a serial port or a raw socket. `model` picks the command table in devices/powersensor.py:
# "keysight-u2004a" or "generic" (commands to be confirmed against the programming guide; see docs/calibration.md).
# "rs-nrp-z11" is a reserved slot with no backend yet (it needs the vendor's toolkit, not plain SCPI).
# Keep 40 dB or more between any transmitter and the sensor, and set max_input_dbm from its datasheet.
[devices.psens0]
kind = "power_sensor"
model = "keysight-u2004a"
transport = "usbtmc"          # "usbtmc", "serial" or "tcp"
port = "/dev/usbtmc0"         # usbtmc node or serial port (serial: baud = 9600)
# host = "192.0.2.10"         # tcp: the sensor's address on the lab network; tcp_port = 5025
serial = "XX00000000"         # `*IDN?` shows it. The driver refuses a different unit.
max_input_dbm = 20.0          # readings within margin_db (3 dB) of this stop with an error
# timeout_s = 5

# --- Bench calibration (optional) ---------------------------------------------------------------------
# Measured path losses, TX power and RX scale: docs/calibration.md, example in calibration.example.toml.
# Each run's manifest records the file's sha256 and date. Without this table, nothing changes.
# [calibration]
# path = "calibration.toml"   # relative to this file
# recabled = "2026-01-20"     # the last re-cabling: a calibration dated before it is refused

# --- Ettus B200mini on USB and USRP E310 on the network ---------------------------------------------
# UHD tools run as separate processes. `uhd_find_devices` shows the serials. The suite refuses a different unit.
# max_rx_rate is the highest rate the driver will ask for. Raise it once your host shows the rate stays clean.
# Transmit is a test tone only. max_tx_gain (default 40 dB) caps it; raise it only after measuring your paths.
# tx_port / rx_port are the names the [wiring] paths use (defaults: B200 "tx/rx" and "rx2", E310 "trx-a" and
# "rx2-a" or "rx2-b" by channel).
[devices.b2000]
kind = "b200"
serial = "0000000"
# max_rx_rate = 10e6

[devices.e3100]
kind = "e310"
addr = "192.168.2.2"          # the E310's address. Keep it on a private network.
serial = "0000000"
subdev = "A:0 A:1"
channel = 1                   # 0 is RX2-A, 1 is RX2-B
# max_rx_rate = 1e6
# tx_subdev = "A:0"           # TX from side A, TRX-A (the default)
# max_tx_gain = 40
# max_tx_seconds = 90000      # l2-sdr-live-link / -soak stream for the whole run (owner, 2026-11-07: 25 h on the cabled
                              # bench). Give both radios the same value; the default (60 s) refuses a long run.

# --- The live link (l2-sdr-live-link) -----------------------------------------------------------------
# The radio helper links UHD (GPL-3.0), so it is in no OASA repo: the owner installs a build and pins it here.
# Every other key has a default, the settings that met every bench target (oasa_lab/livelink.py DEFAULTS).
# [sdr_live]
# helper = "/usr/local/libexec/oasa-lab/oasa-uhd-stream"
# helper_sha256 = "<64 hex digits: sha256sum of the installed helper>"
# duration_s = 3000           # traffic time; a counted job runs at most an hour
# soak_duration_s = 86400     # l2-sdr-live-soak (F11); its job time is the policy's [lab] long_jobs entry
# b200_cpus = "3"             # taskset lists: each radio's helper and bridge on their own CPU
# e310_cpus = "2"
# bridge_rt_prio = 30         # SCHED_FIFO for the bridges; 0 = off. The job unit must allow it
# b200_tx_gain = 40
# e310_tx_gain = 28
# sdr_log = false             # the bridges' per-frame logs (about 80 MB per hour each)

# --- Cabling ------------------------------------------------------------------------------------------
# A suite that transmits names one of these in suite.toml. `loss_db` is the nominal loss of everything
# between the two ends (fixed attenuators, splitter legs, cables): add it up from the parts. The
# checker requires 60 dB or more wherever the far end can transmit (40 dB for the RTL-SDR).
# A transmitting suite on real hardware runs only with: oasa-lab run SUITE --confirm-wiring NAME

[wiring.pluto]
rf_setup = "cabled"             # "cabled" or "shielded"
description = "TX1 -30 dB- 2-way splitter -30 dB- RX1 (splitter 2nd leg -30 dB- RTL-SDR); TX2 -30 dB- -30 dB- RX2"
[[wiring.pluto.paths]]
name = "tx1-rx1"
from = "pluto0:tx1"
to = "pluto0:rx1"
loss_db = 63.5                  # 30 + 3.5 (splitter) + 30
[[wiring.pluto.paths]]
name = "tx2-rx2"
from = "pluto0:tx2"
to = "pluto0:rx2"
loss_db = 60.0                  # 30 + 30
[[wiring.pluto.paths]]
name = "tx1-rtl"
from = "pluto0:tx1"
to = "rtl0"
loss_db = 63.5                  # 30 + 3.5 + 30
receiver_transmits = false

[wiring.usrp]
rf_setup = "cabled"
description = "B200mini TX/RX -60 dB- E310 RX2-B; E310 TRX-A -60 dB- B200mini RX2"
[[wiring.usrp.paths]]
name = "b200-e310"
from = "b2000:tx/rx"
to = "e3100:rx2-b"
loss_db = 60.0                  # 30 + 20 + 10
[[wiring.usrp.paths]]
name = "e310-b200"
from = "e3100:trx-a"
to = "b2000:rx2"
loss_db = 60.0                  # 30 + 20 + 10

# Over the air: no paths and no loss rule; each radio's antenna port instead. Only suites with radiates = true
# may use it, only on radios the owner capped in [antenna] of the lab policy (OASA_LAB_ANTENNA_CAPS for a
# local run).
[wiring.air]
rf_setup = "antenna"
description = "B200mini TX/RX and E310 RX2-A on antennas, about 3 m apart"
antennas = ["b2000:tx/rx", "e3100:rx2-a"]

[wiring.lora]
rf_setup = "cabled"
description = "Heltec A -30 dB- 4-way splitter -30 dB- Heltec B; RTL-SDR on a third splitter leg through 30 dB; 4th leg terminated 50 ohm"
[[wiring.lora.paths]]
name = "a-to-b"
from = "heltec_a"
to = "heltec_b"
loss_db = 72.0                  # 30 + 6 + 6 + 30
[[wiring.lora.paths]]
name = "b-to-a"
from = "heltec_b"
to = "heltec_a"
loss_db = 72.0
[[wiring.lora.paths]]
name = "a-to-rtl"
from = "heltec_a"
to = "rtl0"
loss_db = 66.0                  # 30 + 6 + 30
receiver_transmits = false
[[wiring.lora.paths]]
name = "b-to-rtl"
from = "heltec_b"
to = "rtl0"
loss_db = 66.0
receiver_transmits = false
