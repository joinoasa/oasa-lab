description = "Real PX4 and ArduPilot simulators behind the encrypted oasa-sec link: telemetry, signed commands, a flight, and the drone-side MAVLink guard (needs OASA_SEC_BIN_DIR, PX4_DIR, ARDUPILOT_DIR and pymavlink; about 10 minutes, not in CI)"
expectations = [
  "test_telemetry_through_the_link",
  "test_signed_commands_work",
  "test_unsigned_and_wrong_key_commands_are_ignored",
  "test_fly_arm_takeoff_hold_land_disarm",
  "test_guard_drops_signed_setup_signing",
  "test_guard_drops_ftp",
  "test_guard_drops_signing_param_set",
  "test_captures_hold_no_plaintext",
  "test_negative_control_sees_autopilot_mavlink",
]

[captures]
encrypted = true
# Data packets start with 5 (2-byte counter) or 7 (4-byte counter) header bytes; see oasa-sec docs/oasa-sec-v0-link.md section 3.
skip_header_bytes = 7

# The same SITL MAVLink without the link: the checker must find MAVLink in it.
[captures.control]
encrypted = false
expect_mavlink = true
