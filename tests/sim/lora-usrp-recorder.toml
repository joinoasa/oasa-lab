# The simulated bench with a B200mini as the LoRa suites' recorder and no RTL-SDR (lab.example.toml, the lora
# wiring's B200mini variant). CI and the checks run l2-rf-control and l2-lora-link on it:
#   OASA_LAB_SIM=1 OASA_LAB_INVENTORY=tests/sim/lora-usrp-recorder.toml oasa-lab run l2-rf-control

[lab]
name = "simulated bench, B200mini recorder"
backend = "sim"

[devices.heltec_a]
kind = "serial-radio"
model = "Heltec WiFi LoRa 32 V3"
port = "sim:a"
serial = "SIM-HELTEC-A"
firmware = "sim-modem 0.1"
[devices.heltec_a.radio]
profile = "lora-sf7-bw125"
freq_mhz = 915.0
tx_power_dbm = 10

[devices.heltec_b]
kind = "serial-radio"
model = "Heltec WiFi LoRa 32 V3"
port = "sim:b"
serial = "SIM-HELTEC-B"
firmware = "sim-modem 0.1"
[devices.heltec_b.radio]
profile = "lora-sf7-bw125"
freq_mhz = 915.0
tx_power_dbm = 10

[devices.b2000]
kind = "b200"
serial = "SIM-B200-0001"

[wiring.lora]
rf_setup = "cabled"
description = "Heltec A -30 dB- 4-way splitter -30 dB- Heltec B; B200mini RX2 on a third leg through 30 dB (receive only)"
[[wiring.lora.paths]]
name = "a-to-b"
from = "heltec_a"
to = "heltec_b"
loss_db = 72.0
[[wiring.lora.paths]]
name = "b-to-a"
from = "heltec_b"
to = "heltec_a"
loss_db = 72.0
[[wiring.lora.paths]]
name = "a-to-b200"
from = "heltec_a"
to = "b2000:rx2"
loss_db = 66.0
[[wiring.lora.paths]]
name = "b-to-b200"
from = "heltec_b"
to = "b2000:rx2"
loss_db = 66.0
